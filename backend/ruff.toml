line-length = 120
exclude = [
    "migrations",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    ".venv"
]

[lint]
select = [
    "A", # flake8-builtins
    "E", # pycodestyle
    "F", # flake 8
    "I", # isort,
    "PLC", # Pylint conventions
    "PLE", # Pylint error
    "PLW", # Pylint warnings,
    "UP", # pyupgrade
    "W", # pycodestyle
]


[lint.per-file-ignores]
# Allow unused imports in __init__.py files.
"__init__.py" = ["F401"]

[format]
quote-style = "double"
